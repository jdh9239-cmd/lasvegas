/* --- 카지노 패드 배치 계산 ---
   원칙: 개수가 몇이든 "실제 주사위알"을 전부 보여준다. 요약 뱃지만 남기는 모드는 없다.
   색깔별 묶음을 카드 부채꼴처럼 옆으로 겹쳐 늘어놓고, 안 들어가면
   (1) 겹침을 더 촘촘히 → (2) 묶음을 두 줄로 → (3) 알 크기를 줄인다.
   ×N 뱃지는 개수 가독성을 위한 보조로 항상 함께 붙는다. 스크롤은 절대 만들지 않는다. */
const TILE_PAD = 14;       // .tile padding — CSS와 반드시 같은 값
const SIGN_GAP = 7;        // .tileSign margin-bottom
const RACK_GAP = 7;        // .tilePad margin-top — CSS와 반드시 같은 값
const PAD_INSET = 5;       // .tilePad padding — 이 안쪽으로만 그린다
const MIN_REVEAL = 0.17;   // 겹쳐도 아래 알이 최소 이만큼은 드러나야 셀 수 있다
const PAD_GX = 8;          // 색 묶음 사이 가로 간격
const PAD_GY = 6;          // 색 묶음 줄 간격 — 여러 색이 쌓여도 답답하지 않게
const BADGE_GAP = 5;       // 주사위 묶음과 ×N 뱃지 사이 숨통
const ROT_SLACK = 0.09;    // 알을 살짝 기울여 놓기 때문에 생기는 모서리 삐침 여유(알 크기 대비)

function badgeFS(s) { return Math.max(9, Math.min(13, Math.round(s * 0.56))); }
/* ×N 뱃지가 실제로 차지하는 폭. 어림잡으면(옛 max(18, s*1.15)) 두 자리 수에서 뱃지가
   칸 밖으로 삐져나가 타일 테두리·옆 묶음과 겹친다 → 글자 수까지 넣어 정확히 잰다.
   좌우 padding = fs*0.84, 글자는 '×' + 숫자들이고 900굵기 산세리프 자폭 ≈ 0.62em. */
function badgeW(s, digits) {
  const fs = badgeFS(s);
  return BADGE_GAP + fs * 0.84 + (1 + digits) * fs * 0.62 + 2;
}

/* 알 크기를 큰 쪽부터 훑으며 "칸 안에 확실히 들어가는" 최대 크기를 찾는다.
   가로 배치(cols)는 안쪽 반복이라 같은 크기면 줄 수가 적은 쪽이 먼저 잡힌다.
   reveal = 겹쳤을 때 아래 알이 드러나야 하는 최소 비율(가독성 조건), minS = 허용 최소 알 크기.
   들어갈 자리가 없으면 null → 호출부가 조건을 한 단계 풀어 다시 부른다. */
function searchPad(counts, W, H, reveal, minS) {
  const G = counts.length;
  const digits = Math.max.apply(null, counts.map(n => String(n).length));
  for (let s = 24; s >= minS; s -= 0.5) {
    const slack = s * ROT_SLACK;
    const rowGap = Math.max(2, s * 0.12);
    for (let cols = 1; cols <= Math.min(4, G); cols++) {
      const rows = Math.ceil(G / cols);
      const cellW = (W - (cols - 1) * PAD_GX) / cols;
      const cellH = (H - (rows - 1) * PAD_GY) / rows;
      const stackW = cellW - badgeW(s, digits) - slack;   // 뱃지·기울임 여유를 뺀 나머지가 묶음 몫
      if (stackW < s) continue;                           // 알 한 개도 못 들어가면 이 배치는 탈락
      for (const sub of [1, 2]) {                         // 한 묶음을 한 줄 또는 두 줄로
        if (s * sub + (sub - 1) * rowGap + slack > cellH) continue;
        const ok = counts.every(n => {
          const k = Math.ceil(n / sub);                   // 한 줄에 놓이는 최대 알 수
          if (k <= 1) return true;
          return (stackW - s) / (k - 1) >= s * reveal;
        });
        if (ok) return { s, cols, rows, sub, cellW, cellH, stackW, rowGap };
      }
    }
  }
  return null;
}

/* 자리가 좁아질수록 조건을 순서대로 푼다:
   (1) 넉넉히 → (2) 겹침을 더 촘촘히 + 알을 더 작게 → (3) 거의 포개더라도 전부 담는다.
   어느 단계든 "칸 밖으로 넘치지 않는다"는 조건만은 절대 풀지 않는다. */
function fitPad(counts, W, H) {
  return searchPad(counts, W, H, MIN_REVEAL, 9)
      || searchPad(counts, W, H, 0.09, 7)
      || searchPad(counts, W, H, 0, 4)
      || { s: 4, cols: 1, rows: counts.length, sub: 1, rowGap: 1,
           cellW: W, cellH: H / counts.length, stackW: Math.max(4, W - badgeW(4, 2)) };
}

function fillPad(pad, cas, ci) {
  const entries = Object.entries(cas.dice)
    .map(([pi, n]) => [Number(pi), n])
    .filter(([, n]) => n > 0)
    .sort((a, b) => b[1] - a[1] || a[0] - b[0]);
  if (!entries.length) { pad.innerHTML = ''; return; }

  // 동점 판정: 같은 개수를 가진 색이 2명 이상이면 그 색 주사위들이 함께 깜빡임
  const countFreq = {};
  entries.forEach(([, n]) => { countFreq[n] = (countFreq[n] || 0) + 1; });

  // 실측값 그대로 쓴다 (하한을 두면 없는 공간에 그려 넣게 된다 → 테두리 침범)
  const W = Math.max(0, pad.clientWidth - PAD_INSET * 2);
  const H = Math.max(0, pad.clientHeight - PAD_INSET * 2);
  const lay = fitPad(entries.map(e => e[1]), W, H);
  const s = lay.s;
  const fs = badgeFS(s);
  const rowGap = lay.rowGap;

  let html = '';
  entries.forEach(([pi, n], gi) => {
    const pl = game.players[pi];
    const k = Math.ceil(n / lay.sub);                        // 한 줄에 놓을 알 수
    const step = k > 1 ? Math.min(s * 0.62, (lay.stackW - s) / (k - 1)) : 0;
    const stackW = s + step * (k - 1);
    const rowsUsed = Math.ceil(n / k);
    const stackH = s * rowsUsed + (rowsUsed - 1) * rowGap;
    let dice = '';
    for (let d = 0; d < n; d++) {
      const rr = Math.floor(d / k), cc = d % k;
      const rot = ((ci * 5 + pi * 11 + d * 47) % 9) - 4;     // ±4°까지만 — 여유(ROT_SLACK) 안에서 삐침이 끝난다
      dice += '<span class="mdie dieSkin" style="' + diceBodyStyle(pl.color.hex) +
        ';width:' + s + 'px;height:' + s + 'px;padding:' + (s * 0.15).toFixed(1) + 'px;' +
        'left:' + (cc * step).toFixed(1) + 'px;top:' + (rr * (s + rowGap)).toFixed(1) + 'px;' +
        'z-index:' + (10 + d) + ';transform:rotate(' + rot + 'deg)">' + dieFaceCells(ci + 1) + '</span>';
    }
    const col = Math.floor(gi / lay.rows), row = gi % lay.rows;
    // 칸 안에서 세로 가운데 정렬. 가로는 칸 왼쪽에 붙이되 기울임 여유만큼 안쪽으로 들인다.
    const slack = s * ROT_SLACK / 2;
    const gx0 = PAD_INSET + col * (lay.cellW + PAD_GX) + slack;
    const gy0 = PAD_INSET + row * (lay.cellH + PAD_GY) + Math.max(slack, (lay.cellH - stackH) / 2);
    html += '<span class="mgroup' + (countFreq[n] >= 2 ? ' tie' : '') + '" style="' +
      'left:' + gx0.toFixed(1) + 'px;top:' + gy0.toFixed(1) + 'px;' +
      'height:' + stackH.toFixed(1) + 'px">' +
      '<span class="mstack" style="width:' + stackW.toFixed(1) + 'px;height:' + stackH.toFixed(1) + 'px">' +
      dice + '</span>' +
      '<span class="mcount" style="background:' + pl.color.hex + ';font-size:' + fs + 'px;' +
      'padding:' + (fs * 0.2).toFixed(1) + 'px ' + (fs * 0.42).toFixed(1) + 'px;' +
      'margin-left:' + BADGE_GAP + 'px">×' + n +
      '</span></span>';
  });
  pad.innerHTML = html;
}

function renderCasinos() {
  game.casinos.forEach((cas, ci) => {
    const tile = document.getElementById('tile' + (ci + 1));
    tile.classList.toggle('selected', game.selectedFace === ci + 1);

    // 타일 안에서 세로로 쓸 수 있는 전체 예산. 간판·지폐 거치대·주사위 패드가
    // 이 예산을 나눠 갖고 합이 예산을 넘지 않는다 → 화면이 아무리 낮아도
    // 내용이 타일 밖(=전구 점선 띠 위)으로 밀려나지 않는다.
    const budget = Math.max(0, tile.clientHeight - TILE_PAD * 2 - SIGN_GAP - RACK_GAP);
    const signH = Math.max(0, Math.min(layout.signH, Math.round(budget * 0.34)));

    // 간판: 카지노 상징 + 큰 주사위 눈
    const iconH = Math.max(8, Math.round(signH * 0.72));
    const embH = Math.max(6, Math.round(signH * 0.52));
    // 장식선은 상징 좌우의 독립 칸(.signRule)이다 — 뒤로 깔지 않으므로 겹칠 수 없다
    let html = '<div class="tileSign" style="height:' + signH + 'px">' +
      '<span class="signRule"></span>' +
      '<svg class="emb" viewBox="0 0 24 24" style="width:' + embH + 'px;height:' + embH + 'px">' +
      '<use href="#em' + (ci + 1) + '"/></svg>' +
      '<span class="dieIcon" style="width:' + iconH + 'px;height:' + iconH + 'px">' +
      dieFaceCells(ci + 1) + '</span>' +
      '<span class="signRule"></span></div>';

    // 지폐 거치대: 계단식으로 어긋나게 겹쳐 모든 장의 액면 숫자가 드러나게 한다.
    // 가로로 34%씩 밀면 아래 장의 왼쪽 큰 액면 숫자(폭의 12~29% 구간)가 항상 노출된다.
    const nB = cas.bills.length;
    const SX = 0.34, SY = 0.14;
    // 남는 세로 공간을 지폐 거치대와 주사위 패드가 나눠 갖는다.
    // 주사위 색 묶음이 많을수록 패드 몫을 늘려서 알을 전부 담아도 스크롤이 생기지 않게 한다.
    const nG = Object.values(cas.dice).filter(n => n > 0).length;
    const padShare = nG <= 2 ? 0.44 : (nG <= 4 ? 0.56 : (nG <= 5 ? 0.68 : 0.76));
    // 남은 예산(간판을 뺀 나머지)을 지폐 거치대와 주사위 패드가 나눠 갖는다.
    // 하한(옛 max(52)/max(32)/max(30))을 두면 없는 공간을 있다고 치고 지폐를 키워
    // 타일 밖으로 밀어내므로, 실제로 남은 만큼만 쓴다.
    const rest = budget - signH;
    const availH = rest - Math.round(rest * padShare);   // 지폐 거치대 몫 (나머지는 패드가 flex로 가져간다)
    const innerW = Math.max(20, tile.clientWidth - TILE_PAD * 2);
    const bw = Math.max(12, Math.min(150,
      Math.floor(innerW / (1 + SX * (nB - 1))),
      Math.floor(availH * 2.3 / (1 + SY * (nB - 1)))));
    const bh = Math.round(bw / 2.3);
    const dx = bw * SX, dy = bh * SY;
    html += '<div class="tileRack" style="width:' + (nB ? (bw + dx * (nB - 1)).toFixed(1) : 0) + 'px;' +
      'height:' + (nB ? (bh + dy * (nB - 1)).toFixed(1) : 0) + 'px">' +
      cas.bills.map((v, bi) => billHTML(v, '',
        'position:absolute;left:' + (bi * dx).toFixed(1) + 'px;top:' + (bi * dy).toFixed(1) + 'px;' +
        'width:' + bw + 'px;height:' + bh + 'px;z-index:' + bi)).join('') +
      '</div>';

    html += '<div class="tilePad"></div>';
    tile.innerHTML = html;
    // 패드는 실측 후 채운다 — 남은 공간에 맞춰 주사위를 자동 축소해야 하므로
    fillPad(tile.querySelector('.tilePad'), cas, ci);
  });
}

function updateHintAndButtons() {
  const rollBtn = document.getElementById('rollBtn');
  const confirmBtn = document.getElementById('confirmBtn');
  const hint = document.getElementById('hint');

  rollBtn.disabled = game.finished || game.rolled !== null;
  confirmBtn.disabled = game.finished || game.selectedFace === null;

  if (game.finished) hint.textContent = '';
  else if (!game.rolled) hint.textContent = game.players[game.turn].name + ' — 굴리기를 누르세요';
  else if (anim.active && !anim.grouped) hint.textContent = '';
  else if (game.selectedFace === null) hint.textContent = '나온 눈 중 하나를 선택하세요';
  else hint.textContent = '카지노 ' + game.selectedFace + '에 ' + game.rolled[game.selectedFace] + '개 — 확정';
  hint.style.display = hint.textContent ? '' : 'none';
}

function renderBottom() {
  if (!game.rolled) {
    clearAnimTimers();
    anim.active = false; anim.grouped = false;
    document.querySelectorAll('#diceLayer > *, #throwZone .grpHit').forEach(e => e.remove());
  }
  updateHintAndButtons();
}

function renderAll() {
  renderCorner();
  renderSeats();      // 좌석을 먼저 그려야 좌석띠 깊이를 실측할 수 있다
  computeLayout();    // 남은 중앙 영역에 맞춰 카지노 묶음 크기·위치 결정
  renderCasinos();    // 확정된 타일 치수 안에서 내용 배치
  renderBottom();
}

/* 창 크기(주소창 등장·회전 포함)가 바뀌면 전부 다시 계산한다 */
let relayoutRaf = null;
function onViewportChange() {
  if (!document.getElementById('gameScreen').classList.contains('on')) return;
  if (relayoutRaf) cancelAnimationFrame(relayoutRaf);
  relayoutRaf = requestAnimationFrame(() => {
    relayoutRaf = null;
    const rolling = anim.active && !anim.grouped;
    const grouped = anim.active && anim.grouped;
    renderCorner();
    renderSeats();
    computeLayout(true);   // 화면이 바뀌었을 때만 판을 다시 잡는다
    renderCasinos();
    if (rolling) finishRollAnimation(false);   // 굴리는 중이었다면 즉시 결과 상태로
    else if (grouped) placeGroups(false);      // 이미 모아둔 상태면 새 좌표로 고쳐 잡는다
    updateHintAndButtons();
  });
}
window.addEventListener('resize', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onViewportChange);

/* ===== 주사위 던지기 연출 (확정된 결과의 포장) ===== */
const anim = { active:false, grouped:false, timers:[], raf:null, dice:[], faces:[], size:52, x0:104, hex:'#cf5344', skipHandler:null };

function clearAnimTimers() {
  anim.timers.forEach(t => clearTimeout(t));
  anim.timers = [];
  if (anim.raf) { cancelAnimationFrame(anim.raf); anim.raf = null; }
  if (anim.skipHandler) {
    document.removeEventListener('pointerdown', anim.skipHandler, true);
    anim.skipHandler = null;
  }
}

/* 주사위 한 알을 그린다. 바깥틀은 화면상의 위치·크기만, 안틀은 상자의 자세만 맡는다
   → 원근(바깥틀의 perspective)이 회전에 항상 제대로 걸린다.
   자세 순서: Y로 돌리고 → X로 굴리고 → 마지막에 Z(화면 평면)로 기울인다.
   Z가 맨 앞(=가장 나중에 적용)이라 정면을 향한 면은 Z를 아무리 돌려도 계속 정면이다. */
function setDieAt(d, x, y, rz, sc, rx, ry) {
  d.el.style.transform =
    'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)' +
    (sc && sc !== 1 ? ' scale(' + sc.toFixed(3) + ')' : '');
  d.inner.style.transform =
    'rotateZ(' + rz.toFixed(1) + 'deg)' +
    ' rotateX(' + (rx || 0).toFixed(1) + 'deg)' +
    ' rotateY(' + (ry || 0).toFixed(1) + 'deg)';
}

/* 그림자는 알을 따라가되 "바닥" 높이에 남는다. 알이 높이 뜰수록 넓게 퍼지고 옅어진다
   → 화면상 위로 움직인 게 점프인지 그냥 이동인지가 그림자로 구분된다. */
function setShadowAt(d, x, groundY, lift) {
  if (!d.sh) return;
  const hn = Math.min(1, Math.max(0, lift) / 120);
  d.sh.style.transform =
    'translate(' + (x + (anim.size - d.shW) / 2).toFixed(1) + 'px,' +
    (groundY + anim.size * 0.80).toFixed(1) + 'px)' +
    ' scale(' + (1 + hn * 0.55).toFixed(3) + ')';
  d.sh.style.opacity = Math.max(0.14, 0.64 - hn * 0.48).toFixed(3);
}

function startRollAnimation(faces) {
  clearAnimTimers();
  anim.active = true; anim.grouped = false; anim.faces = faces;
  renderSeats(); // 던지는 동안 좌석의 손 주사위가 비워진 모습
  updateHintAndButtons();

  // 주사위는 판 바깥의 독립 계층에서 움직인다 → 어떤 좌표도 배치에 영향을 주지 않는다
  const layerEl = document.getElementById('diceLayer');
  layerEl.innerHTML = '';
  const tz = document.getElementById('throwZone');
  tz.querySelectorAll('.grpHit').forEach(e => e.remove());
  const R = tz.getBoundingClientRect();          // 모으는 자리 (읽기 좋은 중앙)
  const F = layout.field ||                      // 구르는 범위 = 좌석띠를 뺀 테이블 전역
    { x: R.left, y: R.top, w: R.width, h: R.height };
  const X0 = R.left + (document.getElementById('roundCorner').offsetWidth || 86) + 18;
  anim.x0 = X0;
  const size = Math.max(26, Math.min(52,
    Math.floor((R.right - X0 - 24) / Math.max(4, faces.length)) - 6,
    Math.floor(R.height * 0.54)));
  anim.size = size;
  const hex = game.players[game.turn].color.hex;
  anim.hex = hex;
  const seat = tableGeo.seats[game.turn] || { x: F.x + F.w / 2, y: F.y + F.h + 200 };
  const sx = seat.x - size / 2, sy = seat.y - size / 2;   // 전부 화면 좌표계
  const now = performance.now();
  const minX = F.x + 4, maxX = F.x + F.w - size - 4;
  const minY = F.y + 4, maxY = F.y + F.h - size - 4;

  anim.dice = faces.map((f, i) => {
    // 진짜 상자: 바깥틀(원근·위치) → 안틀(preserve-3d) → 여섯 면
    const el = document.createElement('div');
    el.className = 'dieCube';
    el.style.cssText = 'width:' + size + 'px;height:' + size + 'px;' +
      'perspective:' + Math.round(size * 7) + 'px;--h:' + (size / 2).toFixed(1) + 'px;';
    const inner = document.createElement('div');
    inner.className = 'cubeInner';
    inner.innerHTML = cubeFacesHTML(hex, f);   // 확정된 눈을 앞면에 굽는다 → 정지 자세는 X·Y = 0
    el.appendChild(inner);
    layerEl.appendChild(el);
    const shW = size * 1.06, shH = size * 0.40;
    const sh = document.createElement('div');
    sh.className = 'dieShadow';
    sh.style.cssText = 'width:' + shW.toFixed(1) + 'px;height:' + shH.toFixed(1) + 'px;opacity:0';
    layerEl.appendChild(sh);
    // 멈추는 자리는 테이블 전역 아무 데나 (카지노 타일 위여도 상관없다)
    const tx = minX + Math.random() * Math.max(10, maxX - minX);
    const ty = minY + Math.random() * Math.max(10, maxY - minY);
    const s0x = sx + (Math.random() * 54 - 27), s0y = sy + (Math.random() * 36 - 18);
    // 절반쯤은 목표를 지나쳐 벽에 부딪혔다가 튕겨 들어온다
    let p1 = null;
    if (Math.random() < 0.5) {
      const vx = tx - s0x, vy = ty - s0y, len = Math.hypot(vx, vy) || 1;
      const over = 70 + Math.random() * 160;
      const qx = tx + vx / len * over, qy = ty + vy / len * over;
      const cx = Math.min(Math.max(qx, minX), maxX), cy = Math.min(Math.max(qy, minY), maxY);
      if (Math.abs(cx - qx) > 10 || Math.abs(cy - qy) > 10) p1 = { x: cx, y: cy };  // 실제로 벽에 닿았을 때만
    }
    const d = {
      el, inner, sh, shW, face: f,
      // 손에서 떠나는 지점·시각·속도·거리가 알마다 다르다 (똑같이 움직이면 가짜로 보인다)
      sx: s0x, sy: s0y, tx, ty, p1,
      t0: now + i * 26,
      dur: 680 + Math.random() * 320,
      land: 0.62 + Math.random() * 0.08,          // 이 시점에 바닥에 닿는다
      arc: 40 + Math.random() * 54,               // 던진 방향으로 솟는 포물선 높이
      bounce: size * (0.20 + Math.random() * 0.18),
      // 상자는 여섯 면이 다 있으므로 각도를 묶을 이유가 없다 → 세 축 모두 여러 바퀴 돌린다.
      // X·Y는 "정수 바퀴"만 돈다 → 감속이 끝나면 남는 각이 정확히 0이다(= 확정된 눈이 정면, 옆면 없음).
      turnX: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 3)),  // 앞뒤 구르기 바퀴 수
      turnY: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 2)),  // 좌우 구르기 바퀴 수
      // Z(화면 평면)는 마지막에 걸리므로 어떤 값이든 정면 면을 바꾸지 않는다 → 자유롭게 돌린다
      spin: (Math.random() < 0.5 ? -1 : 1) * (540 + Math.random() * 420),
      // 멈춘 뒤의 기울기는 Z(화면 평면)에만 남긴다 — 알마다 삐뚤빼뚤하되 옆면은 안 보인다
      rotEnd: (Math.random() < 0.5 ? -1 : 1) * (9 + Math.random() * 6),
      wobDir: Math.random() < 0.5 ? -1 : 1,       // 착지 후 흔들리는 방향
    };
    setDieAt(d, d.sx, d.sy, d.rotEnd + d.spin, 1, d.turnX * 360, d.turnY * 360);
    setShadowAt(d, d.sx, d.sy, 0);
    return d;
  });

  const endAt = Math.max(...anim.dice.map(d => d.t0 + d.dur));
  anim.raf = requestAnimationFrame(stepRoll);
  anim.timers.push(setTimeout(() => finishRollAnimation(true), Math.max(120, endAt - now + 80)));

  /* 소리: stepRoll이 쓰는 값(t0·dur·land·p1)을 그대로 읽어 "닿는 순간"만 뽑아 예약한다.
     연출 계산에는 손대지 않으므로 궤적·타이밍은 조금도 달라지지 않는다.
     예약은 anim.timers에 넣어 둔다 → 탭으로 스킵하면 남은 또각거림도 함께 사라진다.
       · easeThrow(t)=0.64 지점 = 벽에 부딪혀 되튀는 순간 (t≈0.325)
       · t=land 첫 착지, 이후 lift 곡선이 0이 되는 t=land+(1-land)/2 와 t=1 이 두 번의 튐 */
  SFX.throw();
  const hits = [];
  anim.dice.forEach(d => {
    const at = d.t0 - now;
    if (d.p1) hits.push({ t: at + d.dur * 0.325, v: 0.7 });
    hits.push({ t: at + d.dur * d.land, land: true });
    hits.push({ t: at + d.dur * (d.land + (1 - d.land) * 0.5), v: 0.55 });
    hits.push({ t: at + d.dur, v: 0.35 });
  });
  hits.sort((a, b) => a.t - b.t);
  hits.forEach(h => anim.timers.push(setTimeout(
    () => { h.land ? SFX.land() : SFX.clack(h.v); }, Math.max(0, h.t))));

  // 연출 중 아무 곳 탭 → 즉시 완료 상태로 스킵
  anim.skipHandler = (e) => {
    if (anim.grouped) return;
    e.preventDefault();
    e.stopPropagation();
    finishRollAnimation(false);
  };
  document.addEventListener('pointerdown', anim.skipHandler, true);
}

const easeThrow = t => 1 - Math.pow(1 - t, 2.6);   // 던진 직후 빠르고 끝에서 잦아든다
const easeSpin  = t => 1 - Math.pow(1 - t, 2.2);   // 회전도 같이 감속 — 착지 시점에 딱 멎는다

function stepRoll(now) {
  anim.raf = null;
  if (anim.grouped) return;
  for (const d of anim.dice) {
    const t = Math.max(0, Math.min(1, (now - d.t0) / d.dur));
    const e = easeThrow(t);
    let x, y;
    if (!d.p1) {                       // 곧장 굴러가 멈춘다
      x = d.sx + (d.tx - d.sx) * e;
      y = d.sy + (d.ty - d.sy) * e;
    } else if (e < 0.64) {             // 벽까지 밀고 갔다가
      const u = e / 0.64;
      x = d.sx + (d.p1.x - d.sx) * u;
      y = d.sy + (d.p1.y - d.sy) * u;
    } else {                           // 튕겨 되돌아와 멈춘다
      const u = (e - 0.64) / 0.36;
      x = d.p1.x + (d.tx - d.p1.x) * u;
      y = d.p1.y + (d.ty - d.p1.y) * u;
    }
    const groundY = y;                 // 그림자가 남는 높이 (뜬 만큼 빼기 전)

    // --- 높이(lift): 포물선으로 날아올랐다가 착지 후 두 번 튄다 ---
    let lift, sc = 1;
    if (t < d.land) {
      lift = d.arc * Math.sin(Math.PI * (t / d.land));
    } else {
      const b = (t - d.land) / (1 - d.land);
      const damp = 1 - b;
      lift = d.bounce * Math.abs(Math.sin(Math.PI * b * 2)) * damp;
      sc *= 1 + 0.07 * Math.sin(Math.PI * b * 2) * damp;        // 닿는 순간 살짝 눌림
    }
    y -= lift;
    sc *= 1 + Math.min(0.30, lift / 300);                        // 높이 뜰수록 카메라에 가까워 커 보인다

    // --- 회전: 세 축 모두 여러 바퀴 돌다가 착지 시점에 맞춰 감속해 멎는다.
    // 남은 회전량(left)이 0이 되는 순간 X·Y는 정확히 0 — 곧 확정된 눈(앞면)이 정면이다. ---
    const rp = Math.min(1, t / d.land);
    const left = 1 - easeSpin(rp);                               // 남은 회전량 비율
    let rx = d.turnX * 360 * left;
    let ry = d.turnY * 360 * left;
    let rz = d.rotEnd + d.spin * left;
    // 착지한 뒤에는 화면 평면(Z)에서만 흔들리다 멎는다 (t=1에서 정확히 0으로 잦아든다).
    // 앞뒤로 끄덕이면(X축) 그 순간 옆면이 드러나므로, 흔들림은 Z에만 싣고
    // 눌림(sc)과 튐(lift)이 착지의 무게를 맡는다 → 바닥에 닿은 뒤로는 X·Y가 계속 정확히 0이다.
    if (t >= d.land) {
      const b = (t - d.land) / (1 - d.land);
      const wob = Math.sin(b * Math.PI * 3.2) * Math.pow(1 - b, 2);
      rz += wob * 11 * d.wobDir;
    }
    if (t >= 1) { rx = 0; ry = 0; rz = d.rotEnd; }                // 멎은 순간엔 Z 기울기만 남긴다(옆면 노출 0)

    setDieAt(d, x, y, rz, sc, rx, ry);
    setShadowAt(d, x, groundY, lift);
  }
  anim.raf = requestAnimationFrame(stepRoll);
}

function finishRollAnimation(animate) {
  if (anim.grouped) return;
  clearAnimTimers();
  SFX.settle();
  anim.grouped = true;
  placeGroups(animate);   // 여기서 모든 알이 "확정된 눈이 정면" 자세로 고정된다
  updateHintAndButtons();
}

// 같은 눈끼리 모아 세우기 (창 크기가 바뀌면 다시 불러 위치를 고쳐 잡는다)
function placeGroups(animate) {
  const tz = document.getElementById('throwZone');
  tz.querySelectorAll('.grpHit').forEach(e => e.remove());
  const R = tz.getBoundingClientRect();          // 화면 좌표 (주사위 계층과 같은 좌표계)
  const X0 = R.left + (document.getElementById('roundCorner').offsetWidth || 86) + 18;
  anim.x0 = X0;
  const size = anim.size;
  const faces = [...new Set(anim.faces)].sort((a, b) => a - b); // 눈 오름차순
  const slotW = Math.max(size + 20, (R.right - X0) / faces.length);
  const plan = [];

  faces.forEach((f, gi) => {
    const members = anim.dice.filter(d => d.face === f);
    const n = members.length;
    const off = n > 1
      ? Math.max(size * 0.18, Math.min(size * 0.52, (slotW - size - 20) / (n - 1)))
      : 0;
    const x0 = X0 + gi * slotW + (slotW - (size + off * (n - 1))) / 2;
    // 타일을 가리지 않도록 던지기존 안쪽으로 모은다
    const y0 = R.top + Math.max(2, (R.height - size) / 2 - 6);
    // 모아 세운 뒤에도 알마다 각도를 달리해 기계적으로 줄 세운 느낌을 없앤다.
    // 단 기울기는 Z(화면 평면에서 빙그르 도는 회전)에만 준다 — X·Y는 정확히 0이라
    // 옆·뒤 다섯 면이 전부 뒤돌아선 상태가 되어 어두운 띠가 노출될 수 없다.
    // 이웃끼리는 부호를 엇갈리게 해 같은 눈 묶음 안에서도 서로 다른 각도로 눕는다.
    members.forEach((d, mi) => plan.push({
      d, x: x0 + mi * off, y: y0,
      rot: (mi % 2 ? 1 : -1) * Math.abs(d.rotEnd),
      rx: 0, ry: 0,
    }));

    const hit = document.createElement('button');
    hit.className = 'grpHit';
    hit.dataset.face = f;
    hit.style.left = (X0 - R.left + gi * slotW + 3) + 'px';   // 히트 영역은 던지기존 기준
    hit.style.width = (slotW - 6) + 'px';
    hit.innerHTML = '<span class="grpBadge">' + f + ' 눈 ×' + game.rolled[f] + '</span>';
    hit.addEventListener('click', () => selectFace(f));
    if (game.selectedFace === f) hit.classList.add('sel');
    tz.appendChild(hit);
  });

  // 전환 클래스를 먼저 확정하고 리플로우를 강제한 뒤 좌표를 준다 → 전환이 확실히 걸린다
  plan.forEach(p => {
    p.d.el.classList.toggle('grouping', !!animate);
    if (p.d.sh) p.d.sh.classList.toggle('grouping', !!animate);
  });
  void tz.offsetWidth;
  plan.forEach(p => {
    p.d.restZ = p.rot;               // 카지노로 날아가는 알이 이 기울기를 그대로 이어받는다
    setDieAt(p.d, p.x, p.y, p.rot, 1, p.rx, p.ry);
    setShadowAt(p.d, p.x, p.y, 0);   // 바닥에 안착 (뜬 높이 0)
  });
}

function selectFace(f) {
  SFX.tap();
  game.selectedFace = f;   // 확정 전 재탭으로 변경 가능
  renderCasinos();
  document.querySelectorAll('.grpHit').forEach(h => h.classList.toggle('sel', +h.dataset.face === f));
  updateHintAndButtons();
}

// 확정 시: 선택한 눈의 주사위알들이 카지노 타일로 미끄러져 들어가는 연출 (클론)
function flyDiceToCasino(f) {
  const tile = document.getElementById('tile' + f);
  if (!tile || !anim.dice.length) return;
  const tR = tile.getBoundingClientRect();
  const size = anim.size;
  anim.dice.filter(d => d.face === f).forEach((d, i) => {
    const r = d.el.getBoundingClientRect();
    // 타일로 들어가면서 20px까지 작아지므로 상자를 그대로 끌고 가지 않는다.
    // 가독성이 전부인 구간이라 여기서부터는 평면 표현(타일 위 주사위와 같은 표현)으로 바꾼다.
    const c = document.createElement('div');
    c.className = 'die3d dieSkin';
    c.innerHTML = dieFaceCells(f);
    c.style.cssText = diceBodyStyle(anim.hex) +
      ';width:' + size + 'px;height:' + size + 'px;padding:' + (size * 0.15).toFixed(1) + 'px;';
    c.style.position = 'fixed';
    // 멈춰 있던 Z 기울기를 그대로 이어받는다 (평면 표현이라 옆면 자체가 없다)
    c.style.transform = 'rotate(' + (d.restZ !== undefined ? d.restZ : d.rotEnd).toFixed(1) + 'deg)';
    c.style.left = r.left + 'px';
    c.style.top = r.top + 'px';
    c.style.zIndex = 90;
    c.style.transition = 'left .4s ease-in, top .4s ease-in, width .4s ease-in, height .4s ease-in, opacity .4s ease-in';
    document.body.appendChild(c);
    requestAnimationFrame(() => {
      c.style.left = (tR.left + tR.width / 2 - 10 + (i % 3) * 8) + 'px';
      c.style.top = (tR.top + tR.height * 0.6 + (i % 2) * 8) + 'px';
      c.style.width = c.style.height = '20px';
      c.style.opacity = '.85';
    });
    setTimeout(() => c.remove(), 430);
  });
}

/* ===== 턴 로직 ===== */
document.getElementById('rollBtn').addEventListener('click', () => {
  if (game.finished || game.rolled) return;
  const p = game.players[game.turn];
  const faces = [];
  const counts = {};
  for (let i = 0; i < p.diceLeft; i++) {
    const f = 1 + Math.floor(Math.random() * 6);
    faces.push(f);
    counts[f] = (counts[f] || 0) + 1;
  }
  game.rolled = counts;      // 결과를 연출 시작 전에 확정
  game.selectedFace = null;
  startRollAnimation(faces);
});

document.getElementById('confirmBtn').addEventListener('click', () => {
  if (game.finished || game.selectedFace === null) return;
  SFX.place();
  flyDiceToCasino(game.selectedFace); // 연출 (확정된 결과의 포장)
  const f = game.selectedFace;
  const n = game.rolled[f];
  const p = game.players[game.turn];

  // 그 눈이 나온 주사위 전부 배치 (일부만 배치 불가)
  const cas = game.casinos[f - 1];
  cas.dice[game.turn] = (cas.dice[game.turn] || 0) + n;
  p.diceLeft -= n;

  game.rolled = null;
  game.selectedFace = null;
  advanceTurn();
  renderAll();
});

function advanceTurn() {
  for (let step = 1; step <= game.players.length; step++) {
    const idx = (game.turn + step) % game.players.length;
    if (game.players[idx].diceLeft > 0) {
      game.turn = idx;
      SFX.turn();
      return;
    }
  }
  game.finished = true;
  startSettlement();
}

/* ===== 라운드 시작: 지폐 분배 연출 (탭으로 스킵) ===== */
const dealAnim = { timers: [], skip: null };

function clearDealAnim() {
  dealAnim.timers.forEach(t => clearTimeout(t));
  dealAnim.timers = [];
  if (dealAnim.skip) { document.removeEventListener('pointerdown', dealAnim.skip, true); dealAnim.skip = null; }
}

/* 카지노 1번부터 순서대로, 한 장씩 더미에서 날아와 뒤집히며 액면이 드러난다.
   같은 카지노에 두 번째 장이 더 깔릴 때는 살짝 뜸을 들여 "$50,000을 넘겨야 멈춘다"는 긴장을 보여준다. */
function startDealAnimation() {
  clearDealAnim();
  const targets = [];
  for (let ci = 1; ci <= 6; ci++) {
    document.querySelectorAll('#tile' + ci + ' .tileRack .vbill')
      .forEach((el, k) => targets.push({ el, ci, k }));
  }
  if (!targets.length) return;
  targets.forEach(t => { t.el.style.visibility = 'hidden'; });
  const deckR = document.getElementById('deckStack').getBoundingClientRect();
  const clones = [];
  let ended = false;
  const finish = () => {
    if (ended) return;
    ended = true;
    clearDealAnim();
    clones.forEach(c => c.remove());
    clones.length = 0;
    targets.forEach(t => { t.el.style.visibility = ''; });
  };
  dealAnim.skip = (e) => { e.preventDefault(); e.stopPropagation(); finish(); };
  document.addEventListener('pointerdown', dealAnim.skip, true);

  const FLY = 300, STEP = 160, EXTRA = 80;
  let at = 0;
  targets.forEach(t => {
    if (t.k > 0) at += EXTRA;                    // 같은 카지노의 추가 장은 한 박자 늦게
    const delay = at;
    at += STEP;
    dealAnim.timers.push(setTimeout(() => {
      if (ended) return;
      const r = t.el.getBoundingClientRect();
      const v = game.casinos[t.ci - 1].bills[t.k];
      if (v === undefined) { t.el.style.visibility = ''; return; }
      const outer = document.createElement('div');
      outer.style.cssText = 'position:fixed;z-index:85;pointer-events:none;perspective:700px;' +
        'left:' + deckR.left + 'px;top:' + deckR.top + 'px;' +
        'width:' + r.width + 'px;height:' + r.height + 'px;' +
        'transition:left ' + FLY + 'ms cubic-bezier(.3,.75,.35,1), top ' + FLY + 'ms cubic-bezier(.3,.75,.35,1);';
      const inner = document.createElement('div');
      inner.style.cssText = 'position:relative;width:100%;height:100%;transform-style:preserve-3d;' +
        'transition:transform ' + FLY + 'ms ease-in-out;';
      const faceStyle = 'position:absolute;left:0;top:0;width:100%;height:100%;' +
        '-webkit-backface-visibility:hidden;backface-visibility:hidden;';
      inner.innerHTML = billBackHTML(faceStyle) + billHTML(v, '', faceStyle + 'transform:rotateY(180deg);');
      outer.appendChild(inner);
      document.body.appendChild(outer);
      clones.push(outer);
      SFX.deal();   // 한 장이 날아오르는 바로 그 순간 (스킵하면 이 타이머째 사라져 소리도 멎는다)
      requestAnimationFrame(() => {
        outer.style.left = r.left + 'px';
        outer.style.top = r.top + 'px';
        inner.style.transform = 'rotateY(180deg)';   // 날아가면서 뒷면 → 앞면
      });
      dealAnim.timers.push(setTimeout(() => {
        const i = clones.indexOf(outer);
        if (i >= 0) clones.splice(i, 1);
        outer.remove();
        t.el.style.visibility = '';
      }, FLY + 20));
    }, delay));
  });
  dealAnim.timers.push(setTimeout(finish, at + FLY + 120));
}

/* ===== 정산에서 지폐가 좌석으로 날아가는 연출 ===== */
function flyBillToSeat(v, pi) {
  const seat = tableGeo.seats[pi];
  if (!seat) return;
  SFX.gain();
  const wrap = document.createElement('div');
  wrap.innerHTML = billHTML(v);
  const b = wrap.firstChild;
  b.style.cssText += ';position:fixed;left:' + (window.innerWidth / 2 - 64) + 'px;top:' +
    (window.innerHeight / 2 - 96) + 'px;width:128px;height:56px;z-index:120;' +
    'transition:left .6s ease-in, top .6s ease-in, opacity .6s ease-in;';
  document.body.appendChild(b);
  requestAnimationFrame(() => {
    b.style.left = (seat.x - 64) + 'px';
    b.style.top = (seat.y - 40) + 'px';
    b.style.opacity = '0';
  });
  setTimeout(() => b.remove(), 660);
}

/* ===== 정산 ===== */
function startSettlement() {
  game.settle = { idx: 0 };
  showSettleCasino();
}

// 카지노 하나를 실제 정산 (상쇄 → 정렬 → 지급 → 남은 지폐 더미 맨 밑)
function settleCasino(ci) {
  const cas = game.casinos[ci];
  const billsShown = [...cas.bills];

  const entries = Object.entries(cas.dice).map(([pi, n]) => [Number(pi), n]);
  // a. 동점 상쇄: 개수가 같은 플레이어들은 순위 무관 전원 탈락
  const freq = {};
  entries.forEach(([, n]) => { freq[n] = (freq[n] || 0) + 1; });
  const eliminated = entries.filter(([, n]) => freq[n] >= 2);
  // b. 남은 플레이어 내림차순 정렬, 1등부터 최고액 지폐부터 한 장씩
  const remaining = entries.filter(([, n]) => freq[n] < 2).sort((a, b) => b[1] - a[1]);
  const sortedBills = [...cas.bills].sort((a, b) => b - a);
  const payouts = []; // {pi, n, bill|null}  (c. 지폐가 모자라면 뒷순위는 빈손)
  remaining.forEach(([pi, n], rank) => {
    const bill = rank < sortedBills.length ? sortedBills[rank] : null;
    if (bill !== null) game.players[pi].bills.push(bill);
    payouts.push({ pi, n, bill });
  });
  // d. 남은 지폐는 순서대로 더미 맨 밑으로
  const leftover = sortedBills.slice(payouts.length);
  game.deck.push(...leftover);
  // e. 주사위 전부 제거
  cas.dice = {};
  cas.bills = [];

  return { billsShown, eliminated, payouts, leftover };
}

function showSettleCasino() {
  const ci = game.settle.idx;
  const r = settleCasino(ci);
  SFX.page();                          // 카지노가 한 곳 넘어간다
  if (r.eliminated.length) SFX.tie();  // 상쇄가 있으면 전환음 뒤에 겹치지 않게 이어 붙는다
  renderAll();

  let html = '<h2 class="goldText">정산 — 카지노 ' + (ci + 1) + '</h2>';
  html += '<div class="settleBills">' +
    r.billsShown.map(v => billHTML(v)).join('') +
    (r.billsShown.length ? '' : '<div class="leftNote">걸린 지폐 없음</div>') +
    '</div>';

  if (r.eliminated.length) {
    html += '<div class="tieBox"><div class="tieTitle">동점 상쇄!</div>' +
      r.eliminated.map(([pi, n]) => {
        const pl = game.players[pi];
        return '<span style="color:' + pl.color.hex + ';font-weight:800">' + pl.name + '</span> ×' + n;
      }).join(' · ') + '</div>';
  }

  if (r.payouts.length) {
    r.payouts.forEach(p => {
      const pl = game.players[p.pi];
      html += '<div class="payRow"><span class="colorDot" style="background:' + pl.color.hex + '"></span>' +
        pl.name + ' ×' + p.n +
        (p.bill !== null
          ? '<span class="amount">' + money(p.bill) + ' 획득</span>'
          : '<span class="amount none">빈손</span>') +
        '</div>';
    });
  } else {
    html += '<div class="leftNote">받는 사람 없음' + (r.eliminated.length ? ' (전원 상쇄)' : '') + '</div>';
  }

  if (r.leftover.length) {
    html += '<div class="leftNote">남은 지폐 ' + r.leftover.map(money).join(', ') + ' → 더미 맨 밑으로</div>';
  }

  html += '<button id="settleNextBtn">다음 카지노</button>';
  const panel = document.getElementById('settlePanel');
  panel.innerHTML = html;
  document.getElementById('settleNextBtn').addEventListener('click', () => {
    game.settle.idx++;
    if (game.settle.idx >= 6) showSettleDone();
    else showSettleCasino();
  });
  document.getElementById('settleOverlay').classList.add('on');

  // 연출: 받은 지폐가 해당 좌석 방향으로 날아가고, 도착하면 그 액면 묶음이 반짝이며 갱신
  r.payouts.forEach((p, i) => {
    if (p.bill === null) return;
    setTimeout(() => flyBillToSeat(p.bill, p.pi), 280 + i * 200);
    setTimeout(() => flashSeatGain(p.pi, p.bill), 280 + i * 200 + 600);
  });
}

function showSettleDone() {
  renderAll();
  // 파산 라운드는 최종 라운드: 남은 라운드가 있어도 우승 판정으로 간다
  if (game.currentRound < game.roundsTotal && !game.bankrupt) {
    const next = game.currentRound + 1;
    const panel = document.getElementById('settlePanel');
    panel.innerHTML = '<div class="settleDoneMsg goldText">정산 완료</div>' +
      '<button id="nextRoundBtn">' + next + '라운드 시작</button>';
    document.getElementById('nextRoundBtn').addEventListener('click', () => {
      SFX.round();
      // 전원 주사위 8개 복구 → 선 교대 → 라운드 +1 → 기존 더미에서 재충전 → 게임판 복귀
      game.players.forEach(p => { p.diceLeft = DICE_PER_PLAYER; });
      game.starter = (game.starter + 1) % game.players.length;
      game.currentRound++;
      document.getElementById('settleOverlay').classList.remove('on');
      startRound();
    });
  } else {
    showWinners();
  }
}

/* ===== 우승 판정 ===== */
function showWinners() {
  SFX.fanfare();
  // 총액 내림차순 → 같으면 지폐 장수 → 그것도 같으면 공동 순위 (총액은 게임 내내 공개 상태)
  const rows = game.players
    .map(p => ({
      name: p.name, hex: p.color.hex,
      total: p.bills.reduce((s, v) => s + v, 0),
      count: p.bills.length,
      bills: p.bills.slice(),
    }))
    .sort((a, b) => (b.total - a.total) || (b.count - a.count));

  let html = '<h2 class="goldText">최종 결과</h2>';
  let rank = 0;
  rows.forEach((r, idx) => {
    const sameAsPrev = idx > 0 && rows[idx - 1].total === r.total && rows[idx - 1].count === r.count;
    if (!sameAsPrev) rank = idx + 1;
    const sameAsNext = idx < rows.length - 1 && rows[idx + 1].total === r.total && rows[idx + 1].count === r.count;
    const shared = sameAsPrev || sameAsNext;
    html += '<div class="payRow' + (rank === 1 ? ' rank1' : '') + '">' +
      '<span style="font-size:21px;font-weight:900;min-width:104px;text-align:left;white-space:nowrap;flex:none">' +
      (rank === 1 ? '👑 ' : '') + (shared ? '공동 ' : '') + rank + '위</span>' +
      '<span class="colorDot" style="background:' + r.hex + '"></span>' +
      '<span class="pname">' + r.name + '</span>' +
      '<span class="miniBills">' + r.bills.map(v => billHTML(v)).join('') + '</span>' +
      '<span class="amount">' + money(r.total) + ' (' + r.count + '장)</span>' +
      '</div>';
  });
  html += '<button id="againBtn">다시 하기</button>';

  const panel = document.getElementById('settlePanel');
  panel.innerHTML = html;
  document.getElementById('againBtn').addEventListener('click', () => {
    SFX.page();
    game.players = []; game.deck = []; game.casinos = [];
    game.currentRound = 1; game.turn = 0; game.rolled = null; game.selectedFace = null;
    game.finished = false; game.settle = null; game.starter = 0; game.bankrupt = false;
    dockControls();
    document.getElementById('settleOverlay').classList.remove('on');
    document.getElementById('gameScreen').classList.remove('on');
    document.getElementById('startScreen').style.display = '';
  });
  document.getElementById('settleOverlay').classList.add('on');
}

/* iOS 핀치 줌 방지 */
document.addEventListener('gesturestart', e => e.preventDefault());
</script>
</body>
